# Project configuration of the SMM test automation (read by the generic framework, see src\smm_automation\project.py).
# Paths are relative to this file's folder.

[project]
name = "SMM"
cli = "smm-auto"
product = "appSMM"
spec_prefix = "SDS"                    # specification tag SDS-<id>
rule_prefix = "SMM"                    # lint rules SMM01..
env_prefix = "SMM"                     # SMM_RIG_CONTROL, SMM_OPERATOR, ...
plugin = "smm_automation.product:SmmPlugin"

[paths]
scope = "catalog/pilot.scope.toml"
catalog_dir = "catalog"
reviews = "catalog/reviews.toml"
suites = ["robot/suites"]
environments = "robot/environments"
results = "results"
briefs = "generated/briefs"
brief_rules = "catalog/brief-rules.md"
brief_target = "robot/suites/{scope}/{area}.robot"
# keyword documentation in the briefs: Python library modules or resource files (relative paths)
keyword_docs = ["smm_automation.SMMTestbench", "robot/resources/smm.resource"]
mutants = "catalog/mutants.toml"
matrix_model = "catalog/state-matrix.toml"
matrix_suite = "robot/suites/pilot/state_matrix.robot"
matrix_questions = "catalog/state-matrix.questions.md"

# Test tiers. capabilities: what the tier can do (see [capabilities]); evidence = false: its verdicts are about a mock,
# not the product; parallel: suites may run in parallel workers; rig_control: the site's rig control adds capabilities.
# Why only the mock tier runs in parallel: offline workers would share one appSMM installation (its config files are
# rewritten per run), the Mosquitto port in appSMM's InstrumentControl.config, the COP port and the SIL log folder;
# the rig is one instrument.
[tiers.mock]
capabilities = ["restart", "broker-restart"]
evidence = false
parallel = true

[tiers.offline]
capabilities = ["restart", "broker-restart", "twin", "applog", "hardware-action"]

[tiers.rig]
capabilities = []
rig_control = true

# Capability tag -> capability. A run excludes the tests whose capability its tier lacks.
[capabilities]
"needs:twin" = "twin"
"needs:hardware-action" = "hardware-action"
"needs:operator" = "operator"
"needs:applog" = "applog"
"requires:restart" = "restart"
"requires:broker-restart" = "broker-restart"

[operator]
# what an operator at the instrument (--operator console|dialog) adds
capabilities = ["operator", "hardware-action"]

[rig]
# rig control restart-<target> subcommand -> the capability it gives
targets = { appsmm = "restart", broker = "broker-restart" }
ready_ports = { broker = 1883 }        # ssh rig control: wait for this port after a restart unless [<target>] port
log_capability = "applog"
log_files = "*.sil"                    # what fetch-log must deliver
log_pattern = "appSMM*.sil"            # default [log] pattern of the ssh rig control

[catalog]
# message names mentioned in specification texts (checked against the ICD by the plugin)
message_pattern = '\b([A-Z][A-Za-z]+?(?:Request|Response|Notification))\b'

[mutation]
faults_env = "SMM_MOCK_FAULTS"
# what service\src\mock\faults.ts understands
fault_actions = ["drop", "duplicate", "delay", "reorder", "wrongTopic", "set", "unset", "invalid"]

[texts]
non_evidence = "<b>MOCK TIER:</b> these verdicts come from the scripted mock appSMM. They check the test framework and the tests themselves, they are <b>not evidence about the SMM product</b>."
nospec_skip = "a SKIP carries what appSMM did"

# Tag rules of `smm-auto lint` (SMM04..SMM07): a test that uses one of `keywords` unconditionally carries `tag` (or one
# of `also`); a test tagged `tag` uses one of `satisfied_by` (default: `keywords`). Keyword use is followed through
# user keywords.
[[lint.tag_rules]]
rule = 4
tag = "needs:twin"
what = "drives the hardware twin"
keywords = [
    "Trigger Hardware Action", "Get Hardware Snapshot", "Hardware State Should Be", "Clear Hardware Twin Racks",
    "Wait For Hardware Command", "Hardware Command Should Not Be Sent", "Set Hardware Faults", "Clear Hardware Faults",
    "Get Hardware Fault Status", "Hardware Fault Should Have Been Applied",
]
satisfied_by = [
    "Trigger Hardware Action", "Get Hardware Snapshot", "Hardware State Should Be", "Clear Hardware Twin Racks",
    "Wait For Hardware Command", "Hardware Command Should Not Be Sent", "Set Hardware Faults", "Clear Hardware Faults",
    "Get Hardware Fault Status", "Hardware Fault Should Have Been Applied", "Trigger Emergency Stop",
]

[[lint.tag_rules]]
rule = 5
tag = "requires:restart"
what = "restarts appSMM"
keywords = ["Restart appSMM"]

[[lint.tag_rules]]
rule = 5
tag = "requires:broker-restart"
what = "restarts the MQTT broker"
keywords = ["Restart MQTT Broker"]

[[lint.tag_rules]]
rule = 6
tag = "needs:applog"
what = "reads the appSMM log files"
keywords = ["Get appSMM Log Messages", "ICD Messages Should Be Logged By appSMM"]

[[lint.tag_rules]]
rule = 7
tag = "needs:hardware-action"
also = ["needs:twin"]
what = "triggers an E-Stop"
keywords = ["Trigger Emergency Stop"]

[[lint.tag_rules]]
rule = 7
tag = "needs:operator"
what = "asks the operator for an action"
keywords = ["Operator Action"]
