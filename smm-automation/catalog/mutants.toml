# Mutant catalogue for mutation testing of the suites (smm-auto mutate, plan 3.2).
#
# Each [[mutant]] is a defect injected into the MOCK appSMM through fault rules (service
# src/mock/faults.ts). `smm-auto mutate` runs the tests tagged SDS-<spec> for the mutant's `specs`
# with the faults active: a failing test kills the mutant; if all pass it SURVIVED, i.e. the suites
# would not notice that defect in appSMM. Mutants measure the tests, never the product.
#
# Fault rule keys: message (name or "*"), action (drop | duplicate | delay | reorder | wrongTopic |
# set | unset | invalid), when (body values that must match), ms (delay; reorder: longest hold),
# topic (wrongTopic, default /is/hca1/tx), fields (set), remove (unset), skip, count.
# The first matching rule decides; skip/count are counted per mock appSMM start.
#
# `specs` lists only the specifications whose text the defect violates. A mutant that survives
# because no specification forbids it (an "equivalent" mutant) does not belong here.

# ------------------------------------------------------------------ Initialization

[[mutant]]
id = "init-response-dropped"
description = "InitializationResponse OK is never published"
specs = [2528698]
faults = [{ message = "InitializationResponse", when = { Status = "OK" }, action = "drop" }]

[[mutant]]
id = "init-response-error"
description = "InitializationResponse says Error although the initialization starts"
specs = [2528698]
faults = [{ message = "InitializationResponse", when = { Status = "OK" }, action = "set", fields = { Status = "Error" } }]

[[mutant]]
id = "init-response-after-initializing"
description = "Initializing is notified before the InitializationResponse"
specs = [2528698]
faults = [{ message = "InitializationResponse", when = { Status = "OK" }, action = "reorder" }]

[[mutant]]
id = "init-response-wrong-topic"
description = "InitializationResponse is published on an analyzer topic instead of is/iw/tx"
specs = [2528698]
faults = [{ message = "InitializationResponse", action = "wrongTopic" }]

[[mutant]]
id = "initializing-not-notified"
description = "The NotInitialized -> Initializing notification is missing"
specs = [2525423, 2528698]
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "Initializing" }, action = "drop" }]

[[mutant]]
id = "initializing-wrong-previous-state"
description = "The Initializing notification names the wrong PreviousState"
specs = [2525423, 2528698]
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "Initializing" }, action = "set", fields = { PreviousState = "Idle" } }]

[[mutant]]
id = "initializing-invalid"
description = "The Initializing notification breaks the ICD schema (unknown property)"
specs = [2528698, 2525390]
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "Initializing" }, action = "invalid" }]

[[mutant]]
id = "clearing-to-idle-not-notified"
description = "The Clearing -> Idle notification is missing (the state still becomes Idle)"
specs = [2528703]
faults = [{ message = "SystemStatusNotification", when = { PreviousState = "Clearing", CurrentState = "Idle" }, action = "drop" }]

[[mutant]]
id = "clearing-to-idle-invalid"
description = "The Clearing -> Idle notification breaks the ICD schema"
specs = [2528703]
faults = [{ message = "SystemStatusNotification", when = { PreviousState = "Clearing", CurrentState = "Idle" }, action = "invalid" }]

[[mutant]]
id = "idle-before-clearing-not-notified"
description = "The Initializing -> Idle notification before Clearing is missing"
specs = [2528706]
faults = [{ message = "SystemStatusNotification", when = { PreviousState = "Initializing", CurrentState = "Idle" }, action = "drop" }]

[[mutant]]
id = "clearing-before-idle"
description = "Clearing is notified before Idle (wrong order)"
specs = [2528706]
faults = [{ message = "SystemStatusNotification", when = { PreviousState = "Initializing", CurrentState = "Idle" }, action = "reorder" }]

