[[mutant]]
id = "poweron-not-notified"
description = "The PowerOn notification after connecting to the broker is missing"
specs = [2525388]
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "PowerOn" }, action = "drop" }]

[[mutant]]
id = "poweron-notified-twice"
description = "PowerOn is notified twice after connecting to the broker"
specs = [2525388]
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "PowerOn" }, action = "duplicate" }]

[[mutant]]
id = "notinitialized-before-poweron"
description = "NotInitialized is notified before PowerOn after connecting to the broker"
specs = [2525388]
# Delay rather than reorder: other messages are published between the two notifications, so a
# reorder hold would be released by one of them and the order would not change.
faults = [{ message = "SystemStatusNotification", when = { CurrentState = "PowerOn" }, action = "delay", ms = 3000 }]

