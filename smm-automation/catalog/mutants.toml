description = "RecoverResponse breaks the ICD schema"
specs = [2532504]
faults = [{ message = "RecoverResponse", when = { Status = "OK" }, action = "invalid" }]

[[mutant]]
id = "recover-response-wrong-topic"
description = "RecoverResponse is published on an analyzer topic"
specs = [2532504]
faults = [{ message = "RecoverResponse", when = { Status = "OK" }, action = "wrongTopic" }]

[[mutant]]
id = "recover-response-late"
description = "RecoverResponse comes after the 20 s limit"
specs = [2532504]
faults = [{ message = "RecoverResponse", when = { Status = "OK" }, action = "delay", ms = 25000 }]

[[mutant]]
id = "recover-ok-outside-estop"
description = "RecoverRequest outside E-Stop is answered with OK"
specs = [2532492]
faults = [{ message = "RecoverResponse", when = { Status = "Error" }, action = "set", fields = { Status = "OK" } }]

[[mutant]]
id = "initializing-before-recover-response"
description = "Initialization is notified before the RecoverResponse"
specs = [2532510, 2653094]
# NotInitialized and Initializing follow each other at once: a short delay puts the response after both.
faults = [{ message = "RecoverResponse", when = { Status = "OK" }, action = "delay", ms = 500 }]

[[mutant]]
id = "recover-not-reinitialized"
description = "After RecoverResponse the Initializing notification is missing"
specs = [2532510, 2653094]
# skip = 1: the first initialization (precondition Idle) is left alone.
faults = [{ message = "SystemStatusNotification", when = { PreviousState = "NotInitialized", CurrentState = "Initializing" }, action = "drop", skip = 1 }]

