[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smm-automation"
version = "0.1.0"
description = "SMM test automation: RV&S ingestion, Robot Framework keywords over the SMM automation service, traceability reports"
requires-python = ">=3.11"
dependencies = [
  "robotframework>=7.0",
  "robotframework-pabot>=5",
  "requests>=2.31",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "robotframework-robocop>=6",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
  "pip-tools>=7",
]

[project.scripts]
smm-auto = "smm_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["smm_automation"]
branch = true

[tool.coverage.report]
# Floor just below the measured value; raise it when tests are added, never lower it.
fail_under = 55
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Bug-oriented rules; line length is not enforced (long HTML/f-strings), prefer <= 120.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["smm_automation"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Generic Robot Framework lint (`robocop check robot`); the SMM-specific rules are `smm-auto lint`.
[tool.robocop.lint]
ignore = [
  "NAME02",  # keyword names keep product spelling (appSMM, E-Stop)
  "NAME18",  # same, for keyword calls
  "TAG05",   # review:pending is removed per test, never as a suite tag
]
configure = [
  "too-long-test-case.ignore_docs=True",
  "too-long-test-case.max_len=25",
  "line-too-long.line_length=140",
]
