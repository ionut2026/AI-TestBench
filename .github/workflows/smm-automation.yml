name: smm-automation

# Framework CI: service contract tests, pipeline unit tests, drift check and the mock tier (framework self-test).
# The offline/rig jobs run on a self-hosted Windows runner labelled `smm-rig`, which has appSMM (offline tier)
# or network access to the automation instrument (rig tier, SMM_RIG_BROKER set on the runner), and the SMM TestBench
# at the pinned commit with `npm ci` done in simulator/ and hwsim/ (SMM_TESTBENCH_DIR set on the runner).
#
# Secrets (optional): SMM_TESTBENCH_TOKEN, only needed if ionut2026/SMM-TestBench becomes private (read access).
# On the rig runner, SMM_RIG_CONTROL (site script, see smm-automation/src/smm_automation/rigcontrol.py) enables the
# appSMM/broker restart and appSMM log tests; without it they are excluded.
# Variables: SMM_RIG_RUNNER = true once a self-hosted runner labelled `smm-rig` is registered; without it the
# nightly/manual hardware job is skipped instead of waiting for a runner that does not exist.

on:
  push:
    paths: ["smm-automation/**", ".github/workflows/smm-automation.yml"]
  pull_request:
    paths: ["smm-automation/**", ".github/workflows/smm-automation.yml"]
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:
    inputs:
      tier:
        description: Tier for the hardware job
        type: choice
        options: [offline, rig]
        default: offline

jobs:
  framework:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SMM_TESTBENCH_DIR: ${{ github.workspace }}\smm-testbench
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Pinned SMM TestBench commit
        id: lock
        run: |
          $lock = Get-Content smm-automation/testbench.lock.json | ConvertFrom-Json
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ionut2026/SMM-TestBench
          ref: ${{ steps.lock.outputs.commit }}
          path: smm-testbench
          token: ${{ secrets.SMM_TESTBENCH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --prefix smm-testbench/simulator
          npm ci --prefix smm-testbench/hwsim
          npm ci --prefix smm-automation/service
          python -m pip install -r smm-automation/requirements-dev.lock
          python -m pip install --no-deps -e smm-automation
      - name: Service typecheck, lint, build and contract tests (with coverage floors)
        working-directory: smm-automation/service
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run coverage
      - name: Python static checks (ruff, mypy)
        working-directory: smm-automation
        run: |
          ruff check src tests
          mypy
      - name: Pipeline unit tests (with coverage floor)
        working-directory: smm-automation
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml
      - name: Test rules (SMM lint + Robocop)
        working-directory: smm-automation
        run: |
          smm-auto lint
          robocop check robot
      - name: Drift check (suites vs committed catalog and review ledger)
        working-directory: smm-automation
        run: smm-auto drift --strict
      - name: State matrix suite is generated from the model
        working-directory: smm-automation
        run: smm-auto matrix --check
      - name: Mock tier (framework self-test, not product evidence)
        working-directory: smm-automation
        run: smm-auto run --tier mock --outdir results/mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smm-mock-results
          path: smm-automation/results/mock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smm-coverage
          path: |
            smm-automation/coverage.xml
            smm-automation/service/coverage

  mutation:
    # Mutation testing of the suites (plan Phase 3): defects are injected into the mock appSMM and the tests of the
    # affected specifications must fail. Nightly/manual only (about 20 minutes). Survivors are filed as an issue.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: framework
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      SMM_TESTBENCH_DIR: ${{ github.workspace }}\smm-testbench
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Pinned SMM TestBench commit
        id: lock
        run: |
          $lock = Get-Content smm-automation/testbench.lock.json | ConvertFrom-Json
          "commit=$($lock.commit)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: ionut2026/SMM-TestBench
          ref: ${{ steps.lock.outputs.commit }}
          path: smm-testbench
          token: ${{ secrets.SMM_TESTBENCH_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci --prefix smm-testbench/simulator
          npm ci --prefix smm-testbench/hwsim
          npm ci --prefix smm-automation/service
          npm run build --prefix smm-automation/service
          python -m pip install -r smm-automation/requirements-dev.lock
          python -m pip install --no-deps -e smm-automation
      - name: Mutation testing (mock tier)
        working-directory: smm-automation
        run: smm-auto mutate --outdir results/mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smm-mutation
          path: smm-automation/results/mutation
      - name: File surviving mutants
        if: always() && hashFiles('smm-automation/results/mutation/survivors.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $title = "SMM automation: surviving mutants"
          $number = gh issue list --repo $env:GITHUB_REPOSITORY --state open --search "in:title `"$title`"" --json number --jq '.[0].number'
          $body = "smm-automation/results/mutation/survivors.md"
          if ($number) {
            gh issue comment $number --repo $env:GITHUB_REPOSITORY --body-file $body
          } else {
            gh issue create --repo $env:GITHUB_REPOSITORY --title $title --body-file $body
          }

  hardware:
    if: vars.SMM_RIG_RUNNER == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: framework
    runs-on: [self-hosted, windows, smm-rig]
    timeout-minutes: 120
    concurrency: smm-rig
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          npm ci --prefix smm-automation/service
          npm run build --prefix smm-automation/service
          python -m venv .venv
          .venv/Scripts/pip install -r smm-automation/requirements-dev.lock
          .venv/Scripts/pip install --no-deps -e smm-automation
      - name: Doctor (service, pinned TestBench, appSMM/broker, rig control)
        # Fails the job early when the bundled TestBench is not the pinned commit or the tier cannot run.
        working-directory: smm-automation
        run: ../.venv/Scripts/smm-auto doctor --tier ${{ inputs.tier || 'offline' }}
      - name: Run ${{ inputs.tier || 'offline' }} tier
        # No operator in CI: needs:operator / needs:hardware-action tests are excluded on the rig.
        working-directory: smm-automation
        run: ../.venv/Scripts/smm-auto run --tier ${{ inputs.tier || 'offline' }} --operator none --outdir results/hardware
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smm-${{ inputs.tier || 'offline' }}-results
          path: smm-automation/results/hardware
